/* ===================== Smart Store Cloud — core ===================== */
const CFG = { url: 'https://ywiqtnpfladgpgolytyn.supabase.co', key: 'sb_publishable_A5o7ucV-GVJUP3RveL5QTg_9nXZWMMx' };

/* ---------- modal dialogs (robust inside any wrapper; no alert/prompt) ---------- */
function form(title, fields, okLabel, opts = {}) {
  return new Promise(resolve => {
    const box = $('#modal'), body = $('#modalBox');
    body.innerHTML = `<h3>${esc(title)}</h3>${opts.intro ? `<p class="muted">${opts.intro}</p>` : ''}<div class="mfields">${fields.map((f, i) => `<div class="fld"><label for="mf${i}">${esc(f.label)}</label>${f.type === 'select' ? `<select id="mf${i}">${f.options.map(o => `<option value="${esc(o.v ?? o)}"${(o.v ?? o) == f.value ? ' selected' : ''}>${esc(o.t ?? o)}</option>`).join('')}</select>` :
      f.type === 'textarea' ? `<textarea id="mf${i}" rows="4" placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>` :
        `<input id="mf${i}" type="${f.type || 'text'}" ${f.type === 'number' ? 'inputmode="decimal" step="any"' : ''} ${f.min != null ? `min="${f.min}"` : ''} value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder || '')}" autocomplete="off">`}${f.hint ? `<small class="muted">${esc(f.hint)}</small>` : ''}</div>`).join('')}</div><p class="err" id="mErr" aria-live="polite"></p><div class="mbtns">${opts.noCancel ? '' : '<button class="btn ghost" id="mCancel" type="button">Cancel</button>'}<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" id="mOk" type="button">${esc(okLabel || 'OK')}</button></div>`;
    box.classList.remove('hidden'); document.body.classList.add('modal-open');
    const done = v => { box.classList.add('hidden'); document.body.classList.remove('modal-open'); resolve(v) };
    const first = $('#mf0'); if (first) setTimeout(() => first.focus(), 50);
    $('#mOk').onclick = () => {
      const out = {};
      for (let i = 0; i < fields.length; i++) {
        const f = fields[i], el = $('#mf' + i); let v = el.value;
        if (f.type === 'number') { v = v === '' ? null : Number(v) }
        else v = String(v).trim();
        if (f.req && (v === null || v === '')) { $('#mErr').textContent = f.label + ' is required.'; el.focus(); return }
        if (f.type === 'number' && v !== null && (!Number.isFinite(v) || (f.min != null && v < f.min))) { $('#mErr').textContent = f.label + ' must be a number' + (f.min != null ? ' of at least ' + f.min : '') + '.'; el.focus(); return }
        if (f.int && v !== null && !Number.isInteger(v)) { $('#mErr').textContent = f.label + ' must be a whole number.'; el.focus(); return }
        out[f.k] = v;
      }
      done(out);
    };
    const c = $('#mCancel'); if (c) c.onclick = () => done(null);
    box.onclick = e => { if (e.target === box && !opts.noCancel) done(null) };
  });
}
async function sure(msg, okLabel, danger) {
  return new Promise(resolve => {
    const box = $('#modal'), body = $('#modalBox');
    body.innerHTML = `<p class="mmsg">${esc(msg).replace(/\n/g, '<br>')}</p><div class="mbtns"><button class="btn ghost" id="mCancel" type="button">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" id="mOk" type="button">${esc(okLabel || 'Yes')}</button></div>`;
    box.classList.remove('hidden'); document.body.classList.add('modal-open');
    const done = v => { box.classList.add('hidden'); document.body.classList.remove('modal-open'); resolve(v) };
    $('#mOk').onclick = () => done(true); $('#mCancel').onclick = () => done(false); box.onclick = e => { if (e.target === box) done(false) };
  });
}
function showInfo(html) {
  return new Promise(resolve => {
    const box = $('#modal'), body = $('#modalBox');

    box.classList.remove('hidden'); document.body.classList.add('modal-open');

}

const qKey = () => 'ssc_q_' + uid();

let flushing = false;
let flushAgain = false;

  if (flushing) { flushAgain = true; return 0 } if (!session) return; flushing = true; let sent = 0;
  try { do { flushAgain = false;
    for (const item of getQ().filter(x => x.status === 'pending')) {
      try {
        await rpc('record_sale', { p_id: item.id, p_business: item.biz, p_sold_on: item.sold_on, p_cash: item.cash, p_transfer: item.transfer, p_credit: item.credit, p_items: item.items.map(i => ({ product_id: i.product_id, qty: i.qty, unit_price: i.unit_price })), p_note: item.note || null });
        setQ(getQ().filter(x => x.id !== item.id)); sent++;
      } catch (e) {
        if (e.offline || e.signedOut) break;
        if (e.status >= 400 && e.status < 500 && ![401, 408, 429].includes(e.status)) setQ(getQ().map(x => x.id === item.id ? { ...x, status: 'error', error: e.message } : x));
        else break;

  if (sent) { await loadProducts().catch(() => { }); if (S.tab === 'sell') renderPlist(), renderTodaySales(); }

}

  try{const file=new File([blob],name,{type:'application/pdf'});

  }catch(e){if(e&&e.name==='AbortError'){pvStatus('Share cancelled. Nothing was saved yet.');return}}

  try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{try{a.remove();URL.revokeObjectURL(url)}catch(e){}},60000);
    pvStatus('Download requested for '+name+'. Look for it in Downloads / your notifications. If nothing arrived, this app cannot save files directly — tap "Share / Copy text" to send the report by WhatsApp or paste it into Notes.');
  }catch(e){pvStatus('This app could not start a file download. Tap "Share / Copy text" instead.')}
}

I.snote = el => { S.saleNote = el.value };

function refreshCartNums(i) { const l = S.cart[i], a = $('#ca' + i); if (a) a.textContent = money((Number(l.qty) || 0) * (Number(l.price) || 0)); const t = $('#cartTotal'); if (t) t.textContent = money(cartTotal()); const h = $('#payHint'); if (h) h.innerHTML = payHint() }

  if (!S.cart.length) return toast('Add at least one product.', 'bad');
  const items = [];
  for (const l of S.cart) {
    const qty = Number(l.qty), price = r2(l.price);
    if (!Number.isInteger(qty) || qty <= 0) return toast('Quantity for ' + l.name + ' must be a whole number above 0.', 'bad');
    if (!Number.isFinite(price) || price < 0) return toast('Check the price for ' + l.name + '.', 'bad');
    items.push({ product_id: l.pid, qty, unit_price: price, name: l.name });
  }
  const total = r2(items.reduce((n, i) => n + i.qty * i.unit_price, 0)); let cash = 0, transfer = 0, credit = 0; const m = S.pay.mode;
  if (m === 'cash') cash = total; else if (m === 'transfer') transfer = total; else if (m === 'credit') credit = total;
  else { cash = r2(S.pay.cash || 0); transfer = r2(S.pay.transfer || 0); credit = r2(total - cash - transfer); if (cash < 0 || transfer < 0 || credit < -0.004) return toast('Cash + transfer is more than the sale total.', 'bad'); if (credit < 0) credit = 0 }
  const need = {}; items.forEach(i => need[i.product_id] = (need[i.product_id] || 0) + i.qty);
  const over = Object.keys(need).map(id => S.products.find(p => p.product_id === id)).filter(p => p && need[p.product_id] > stockOf(p));

  const sale = { id: uuid(), biz: S.biz.id, sold_on: saleDay(), cash, transfer, credit, items, note: (S.saleNote || '').trim() || null, at: Date.now(), status: 'pending' };
  setQ([...getQ(), sale]); S.cart = []; S.saleNote = ''; S.pay = { mode: 'cash', cash: '', transfer: '' };

  const sent = await flushQueue();

async function buildCloudModel(date, type) {
  const B = S.biz.id, start = type === 'weekly' ? addDays(date, -6) : date;
  const [prods, moves, sales, exps] = await Promise.all([
    loadProducts(),
    fetchAll('stock_moves?select=product_id,qty,kind,moved_on,note&business_id=eq.' + B + '&moved_on=lte.' + date + '&order=created_at.asc,id.asc'),
    fetchAll('sales?select=id,total,cash,transfer,credit,sale_items(product_id,qty,amount)&business_id=eq.' + B + '&voided=eq.false&sold_on=gte.' + start + '&sold_on=lte.' + date + '&order=created_at.asc,id.asc'),
    fetchAll('expenses?select=spent_on,description,amount,method&business_id=eq.' + B + '&voided=eq.false&spent_on=gte.' + start + '&spent_on=lte.' + date + '&order=spent_on.asc,created_at.asc,id.asc')]);
  const open = {}, close = {}, recv = {}, notes = {}, sold = {}, amt = {};
  const add = (o, k, v) => o[k] = (o[k] || 0) + v;
  moves.forEach(m => { add(close, m.product_id, m.qty); if (m.moved_on < start) add(open, m.product_id, m.qty); else if (m.kind === 'receipt') { add(recv, m.product_id, m.qty); (notes[m.product_id] = notes[m.product_id] || []).push(m.note || (m.qty + ' received')) } });
  let qty = 0, amount = 0, cash = 0, transfer = 0, credit = 0;
  sales.forEach(s => { amount += Number(s.total); cash += Number(s.cash); transfer += Number(s.transfer); credit += Number(s.credit); (s.sale_items || []).forEach(i => { add(sold, i.product_id, i.qty); add(amt, i.product_id, Number(i.amount)); qty += i.qty }) });
  const rows = prods.filter(p => p.active).map(p => {
    const id = p.product_id, o = open[id] || 0, c = close[id] || 0, so = sold[id] || 0, rc = recv[id] || 0, other = c - o - rc + so;
    let rem = (notes[id] || []).join('; '); if (other) rem += (rem ? '; ' : '') + 'Other stock changes: ' + (other > 0 ? '+' : '') + other;
    return { name: p.name, open: o, close: c, sold: so, price: Number(p.price), amount: amt[id] || 0, remarks: rem, _keep: !!(o || c || so || amt[id] || rem || Number(p.price)) };
  }).filter(r => r._keep);
  rows.forEach((r, i) => { r.sn = i + 1; delete r._keep });
  const expense = exps.reduce((n, e) => n + Number(e.amount), 0), received = cash + transfer;
  return {
    v: 1, title: type === 'weekly' ? 'WEEKLY STOCK AND SALES REPORT' : 'DAILY STOCK AND SALES REPORT', account: S.biz.name, type, start, end: date, prepared: S.myName, generated: stamp(), rows,
    expenses: exps.map(e => ({ date: e.spent_on, description: e.description, method: e.method, amount: Number(e.amount) })),
    totals: { qty, amount: r2(amount), cash: r2(cash), transfer: r2(transfer), received: r2(received), credit: r2(credit), expense: r2(expense), balance: r2(received - expense) }
  };
}

function describe(r) {
  const n = r.new_row || {}, o = r.old_row || {}, t = r.table_name, a = r.action;
  if (t === 'sale_items') return null;
  if (t === 'sales' && a === 'INSERT') return ['sale', `recorded a sale of ${money(n.total)} (${n.payment})`];
  if (t === 'sales' && a === 'UPDATE' && n.voided && !o.voided) return ['void', `voided a sale of ${money(n.total)}. Reason: “${n.void_reason}”`];
  if (t === 'expenses' && a === 'INSERT') return ['exp', `added expense ${money(n.amount)}: ${n.description}`];
  if (t === 'expenses' && a === 'UPDATE' && n.voided && !o.voided) return ['xvoid', `voided expense ${money(n.amount)}. Reason: “${n.void_reason}”`];
  if (t === 'products' && a === 'INSERT') return ['padd', `added product “${n.name}” at ${money(n.price)}`];
  if (t === 'products' && a === 'UPDATE') { const c = []; if (Number(n.price) !== Number(o.price)) c.push(`price of “${n.name}” ${money(o.price)} → ${money(n.price)}`); if (n.name !== o.name) c.push(`renamed “${o.name}” → “${n.name}”`); if (n.active !== o.active) c.push(`“${n.name}” ${n.active ? 'made active' : 'made inactive'}`); if (n.min_stock !== o.min_stock) c.push(`alert level of “${n.name}” ${o.min_stock} → ${n.min_stock}`); if (Number(n.cost) !== Number(o.cost)) c.push(`cost of “${n.name}” changed`); return c.length ? ['pedit' + c.length, 'changed ' + c.join('; ')] : null }
  if (t === 'stock_moves' && a === 'INSERT') { const nm = pName(n.product_id); if (n.kind === 'receipt') return ['recv', `received ${n.qty} × ${nm}`]; if (n.kind === 'adjust') return ['adj', `adjusted stock of ${nm} by ${n.qty > 0 ? '+' : ''}${n.qty} (${n.note || 'no note'})`]; if (n.kind === 'opening') return ['open', `set opening stock of ${nm} to ${n.qty}`]; return null }
  if (t === 'members') { if (a === 'INSERT') return ['join', `${n.display_name} joined as ${n.role}`]; if (a === 'UPDATE') { const c = []; if (n.role !== o.role) c.push(`${n.display_name} is now ${n.role}`); if (n.active !== o.active) c.push(n.active ? `${n.display_name} restored` : `${n.display_name} lost access`); return c.length ? ['mem', c.join('; ')] : null } }
  if (t === 'invites' && a === 'INSERT') return ['inv', `created a ${n.role} invite`];
  if (t === 'invites') return null;
  if (t === 'businesses' && a === 'UPDATE') return ['biz', 'changed business settings'];
  return null;
}

  if (!newSales.length && !newRecs.length && !newExps.length && !missing.length) { prog(''); return showInfo('<h3>Nothing new</h3><p>This business already has everything in that file.</p>') }
  if (!await sure(`Add the newer records from this file to ${S.biz.name}?\n\n• ${newSales.length} new sales (${money(addTotal)})\n• ${newRecs.length} stock received entries\n• ${newExps.length} expenses\n• ${missing.length} new products\n\nRecords that are already here are skipped.`, 'Add now')) { prog(''); return }
  const dates = [...d.sales, ...d.receipts, ...d.expenses].filter(x => x.account === acct).map(x => x.date).filter(Boolean).sort(), openOn = dates.length ? addDays(dates[0], -1) : today();
  if (missing.length) {
    prog('Adding new products…');
    const rows = await insert('products', missing.map(p => ({ business_id: B, name: String(p.name || 'Item').slice(0, 200), category: null, price: r2(Math.max(0, Number(p.price) || 0)), min_stock: Math.max(0, Math.round(Number(p.minimum) || 0)) })), true);
    if (rows.length !== missing.length) throw new Error('New product count mismatch. Nothing further was added.');
    const o = []; missing.forEach((p, i) => { map[p.id] = rows[i].id; if (Number(p.opening) > 0) o.push({ business_id: B, product_id: rows[i].id, qty: Math.round(Number(p.opening)), kind: 'opening', note: 'Imported opening stock', moved_on: openOn }) });
    if (o.length) await insert('stock_moves', o);
  }
  if (newRecs.length) { prog('Adding stock received…'); await insert('stock_moves', newRecs.map(x => ({ business_id: B, product_id: map[x.productId], qty: Math.round(Number(x.qty)), kind: 'receipt', note: x.remark || 'Imported', moved_on: x.date }))) }
  for (let i = 0; i < newSales.length; i++) {
    const x = newSales[i]; prog(`Adding sales… ${i + 1} of ${newSales.length}`);
    const amount = r2(Number(x.qty) * Number(x.price)), cash = r2(Number(x.cash) || 0), tr = r2(Number(x.transfer) || 0), credit = Math.max(0, r2(amount - cash - tr));
    for (let tries = 0; ; tries++) { try { await rpc('record_sale', { p_id: uuid(), p_business: B, p_sold_on: x.date, p_cash: cash, p_transfer: tr, p_credit: credit, p_items: [{ product_id: map[x.productId], qty: Math.round(Number(x.qty)), unit_price: r2(Number(x.price)) }], p_note: 'Imported' }); break } catch (e) { if (tries >= 2 || (e.status >= 400 && e.status < 500 && e.status !== 429)) throw new Error('Stopped after ' + i + ' sales: ' + e.message + '. Run "Add only the newer records" again; it continues where it stopped without doubling.'); await new Promise(r => setTimeout(r, 800)) } }
  }
  if (newExps.length) { prog('Adding expenses…'); await insert('expenses', newExps.map(e => ({ business_id: B, spent_on: e.date, description: String(e.description || 'Expense').slice(0, 300), amount: r2(e.amount), method: ['cash', 'transfer', 'other'].includes(String(e.method).toLowerCase()) ? String(e.method).toLowerCase() : 'other' }))) }
  // ---- verify against the file: sales total and every product's stock ----
  prog('Checking…'); await loadProducts();
  const back = await fetchAll('sales?select=total,voided&business_id=eq.' + B + '&order=id.asc'), tot = r2(back.filter(x => !x.voided).reduce((n, x) => n + Number(x.total), 0)), want = r2(fsales.reduce((n, x) => n + Number(x.qty) * Number(x.price), 0));
  const exp = {}; fps.forEach(p => exp[p.id] = Math.round(Number(p.opening) || 0)); frecs.forEach(x => exp[x.productId] += Math.round(Number(x.qty))); fsales.forEach(x => exp[x.productId] -= Math.round(Number(x.qty)));
  let bad = []; fps.forEach(p => { const dbp = S.products.find(q => q.product_id === map[p.id]); if (!dbp || stockOf(dbp) !== exp[p.id]) bad.push(p.name + ' (file says ' + exp[p.id] + ', app has ' + (dbp ? stockOf(dbp) : '?') + ')') });
  const expTotal = r2(fexps.reduce((n, x) => n + Number(x.amount), 0)), dbExp2 = r2((await fetchAll('expenses?select=amount,voided&business_id=eq.' + B + '&order=id.asc')).filter(x => !x.voided).reduce((n, x) => n + Number(x.amount), 0));
  const good = Math.abs(tot - want) < 0.01 && !bad.length && Math.abs(expTotal - dbExp2) < 0.01;
  await showInfo(`<h3>Newer records added</h3><p>Added ${newSales.length} sales, ${newRecs.length} stock entries, ${newExps.length} expenses and ${missing.length} new products.</p><p class="muted">Sales total in the app: <b>${money(tot)}</b><br>Sales total in your file: <b>${money(want)}</b><br>Expenses in the app: <b>${money(dbExp2)}</b> · in your file: <b>${money(expTotal)}</b><br>Products whose stock matches the file: <b>${fps.length - bad.length} of ${fps.length}</b></p>${good ? '<p class="good">✓ Everything matches your backup exactly.</p>' : '<p class="err">Something does not match. Do not rely on these records yet.' + (bad.length ? '<br>' + esc(bad.slice(0, 6).join('; ')) : '') + '</p>'}`);
  go('dash');
});

/* ---------- ACCOUNT ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S.tab === 'acct') VIEWS.acct() });
VIEWS.acct = function () {
  const bad = myQ().filter(x => x.status === 'error').length;
  $('#view').innerHTML = `<section class="card"><div class="cardhead"><h2>Account</h2></div><div class="kv"><span>Name</span><b>${esc(S.myName)}</b><span>Email</span><b>${esc(session.user.email)}</b><span>Business</span><b>${esc(S.biz.name)}</b><span>Your role</span><b>${ROLE_LABEL[S.role]}</b><span>App version</span><b>${APP_VERSION}</b></div>
  ${installEvt ? '<button class="btn good block" data-act="install">Install app on this phone</button>' : '<p class="muted small">To install: in Chrome tap ⋮ then “Install app” or “Add to Home screen”.</p>'}
  <button class="btn ghost block" data-act="conncheck">Run connection check</button><pre id="connOut" class="pre hidden"></pre>
  ${S.role === 'owner' || S.memberships.length ? '<button class="btn ghost block" data-act="newbiz">Create another business</button>' : ''}
  ${bad ? queueBanner() : ''}
  <button class="btn danger block" data-act="signout">Sign out</button></section>`;
};
A.install = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => { }); installEvt = null; VIEWS.acct() };
A.newbiz = () => busy(null, async () => {
  const v = await form('Create another business', [{ k: 'name', label: 'Business name', req: true }, { k: 'me', label: 'Your name', req: true, value: S.myName }], 'Create'); if (!v) return;
  const nid = await rpc('create_business', { p_name: v.name, p_display_name: v.me }); LS.set('ssc_biz_' + uid(), nid); toast('Created', 'good'); await boot();
});
A.conncheck = el => busy(el, async () => {
  const out = $('#connOut'); out.classList.remove('hidden'); const L = []; const show = () => out.textContent = L.join('\n');
  const step = async (name, fn) => { try { const v = await fn(); L.push('✓ ' + name + (v ? ' — ' + v : '')) } catch (e) { L.push('✗ ' + name + ' — ' + (e.message || e)) } show() };
  L.push('Internet: ' + (navigator.onLine ? 'connected' : 'OFFLINE')); show();
  await step('Server reachable', async () => { const r = await rawFetch('/rest/v1/', { auth: false }); return 'HTTP ' + r.status });
  await step('Signed in', async () => { const r = await rawFetch('/auth/v1/user'); if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(); return j.email });
  await step('Business membership', async () => { const r = await get('members?select=role&user_id=eq.' + uid() + '&business_id=eq.' + S.biz.id); return r.length ? r[0].role : (() => { throw new Error('none') })() });
  await step('Products readable', async () => { const r = await get('product_stock?select=product_id&business_id=eq.' + S.biz.id + '&limit=1'); return 'ok' });
  if (isMgr()) await step('Live summary', async () => { const s = await rpc('daily_summary', { p_business: S.biz.id, p_from: today(), p_to: today() }); return 'today sales ' + money(s.sales_total) });
  L.push('Sales waiting on this phone: ' + getQ().filter(x => x.status === 'pending').length); L.push('Version ' + APP_VERSION); show();
});

/* ---------- global wiring ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const f = A[el.dataset.act]; if (!f) return;
  e.preventDefault(); Promise.resolve().then(() => f(el, e)).catch(err => { if (err && err.signedOut) { saveSession(null); showAuth('in', err.message) } else toast((err && err.message) || 'Something went wrong', 'bad') });
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && I[el.dataset.in] && el.type !== 'checkbox' && el.type !== 'file' && el.type !== 'date') I[el.dataset.in](el) });
document.addEventListener('change', e => { const el = e.target.closest('[data-in]'); if (el && I[el.dataset.in] && (el.type === 'checkbox' || el.type === 'file' || el.type === 'date')) I[el.dataset.in](el); if (e.target.id === 'bizSel') { LS.set('ssc_biz_' + uid(), e.target.value); boot() } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('#auth') && $('#aGo')) { e.preventDefault(); $('#aGo').click() } });
window.addEventListener('error', e => { try { toast('Error: ' + (e.message || 'unknown'), 'bad') } catch (x) { } });
window.addEventListener('unhandledrejection', e => { try { const m = e.reason && e.reason.message; if (m && !/No internet/.test(m)) toast(m, 'bad') } catch (x) { } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && session && S.biz) { flushQueue(); if (S.tab === 'dash') VIEWS.dash(true) } });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => { });
boot();
